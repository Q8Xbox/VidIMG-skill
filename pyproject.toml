[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidimg"
version = "0.2.0"
description = "Faithful photo and video restoration with free open models, Video2X and AviSynth+/VapourSynth, for Claude Code"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy",
    "opencv-python>=4.10",
    "scikit-image",
    "scipy",
    "pillow",
    "mcp",
    "py7zr",
]

[tool.setuptools.packages.find]
include = ["vidimg*"]

# the block library and the defect list are data, read at run time (vidimg/library.py)
[tool.setuptools.package-data]
vidimg = ["blocks/*.json", "defects.json"]

[project.scripts]
vidimg = "vidimg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs the real models / Video2X on the GPU (slow)",
]
addopts = "-m 'not live'"
